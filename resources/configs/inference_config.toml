# Kataglyphis inference configuration; see the kataglyphis.toml_config module.

[model]
model_path = "models/deim_dfine_n_coco.onnx"
framework = "onnx"
input_width = 640
input_height = 640
confidence_threshold = 0.25
iou_threshold = 0.45
# Unset labels name classes through the detector's built-in list, resources/coco-classes.txt.
output_layout = "xyxy_score_class"

[pipeline]
camera_device = "0"
capture_width = 1280
capture_height = 720
capture_fps = 30
enable_inference = true
enable_overlay = true

[general]
log_level = "info"