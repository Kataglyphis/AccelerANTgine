# ubuntu-26.04 / -arm are GitHub preview labels (family-wide since 2026-09-06)
# that the pinned actionlint 1.7.12 - still the latest release - predates. This
# file only ADDS labels to actionlint's built-in list: it disables no rule,
# excludes no file and silences no finding.
#
# Without it the new workflow gate (lint-gates.yml) fails on its own
# `runs-on: ubuntu-26.04` line with "label \"ubuntu-26.04\" is unknown" before
# it can report a single real finding - on a runner that demonstrably exists
# and that this repo already targets everywhere: ci-init.sh defaults RUNNER to
# ubuntu-26.04, ci-docs.sh gates the docs build on it, linux_run_x86.yml passes
# it and linux_run_arm.yml passes ubuntu-26.04-arm.
#
# actionlint discovers this file by path relative to the repo being linted, so
# it cannot be read out of third_party/ContainerHub - the hub carries the same
# declaration for its own tree, as do BeschleunigerBallett, OrchestrANT and
# OmniAccelerANT. That per-consumer duplication is a known upstream candidate:
# lint-workflows.sh could fall back to the hub's config when a consumer ships
# none, and this file should be deleted the day it does.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
