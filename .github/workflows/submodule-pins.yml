name: Submodule pins

# A drifted gitlink silently changes every gate; FUZZTEST moves with the abseil pin, which the suite cannot see (AGENTS.md section 3).

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Submodule pins sit at their recorded commits
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@develop
    with:
      # Pinned so a hub default change cannot break the lane: Pester 5 blinds its diagnostics, 6 rejects -Quiet.
      pester-version: '3.4.0'
