name: Submodule Pins

# ONE `uses:` LINE. Seven submodules, and one of them - third_party/ANTfrastructure
# - owns the scripts that run the tests, the static analysis, the packaging and
# the docs build. A drifted gitlink here does not degrade one job; it silently
# changes every gate this repo has, and `git submodule status` marks it with a
# '+' that is easy to miss in a wall of CI output. AGENTS.md section 3 names the
# coupling the suite cannot see: FUZZTEST moves together with the abseil pin in
# third_party/CMakeLists.txt.
#
# The job itself became reusable upstream (hub .github/workflows/submodule-pins.yml,
# workflow_call), where its 40-line Pester rationale lives once instead of in
# three near-identical consumer copies. It checks out with submodules, then runs
# ANTfrastructure's own shared/windows/tests/Submodule.Pins.Tests.ps1 - the suite
# is repo-agnostic: it takes the superproject root as a parameter and asserts,
# for EVERY configured submodule, that it is checked out, sits at its recorded
# commit, and is pinned to a commit still reachable from its remote. Nothing here
# has to name a submodule for it to be covered, and one added later is covered
# the day it lands. run-pester-suite refuses a vacuous pass (TotalCount == 0 ->
# exit 1), so the gate cannot be green over nothing.
#
# WHAT STAYS LOCAL: this repo's `on:` filters, and the Pester version. The suite
# path defaults upstream to exactly the vendored copy this repo has, so it is not
# repeated - but the version is passed explicitly even though 3.4.0 is also the
# hub's default. That pin is this consumer saying which dialect it was verified
# against, for the reasons measured in jotrockenmitlocken's copy: 5.7.1 passes
# only through Pester 5's deprecated legacy parameter set, where $r.TestResult is
# $null and the action's per-failure diagnostics print nothing, and 6.1.0 rejects
# -Quiet and dies before a single test runs. A hub-side default change must not
# be able to silently blind or break this lane.
#
# The runner stays the upstream default windows-2025: Pester 3.4.0 is a Windows
# PowerShell-era module never released for PowerShell Core on Linux, and
# `windows-latest` is a moving alias that would swap the OS image - and with it
# the Windows PowerShell 5.1 that 3.4.0 needs - under a green run with no commit
# to blame.
#
# @main, like every other ANTfrastructure reference in this repo: upstream is
# pushed before the consumer change that needs it.

on:
  push:
    branches: ["main"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: ["main"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Submodule pins sit at their recorded commits
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@main
    with:
      pester-version: '3.4.0'
