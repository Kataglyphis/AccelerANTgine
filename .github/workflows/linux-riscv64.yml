# riscv64: cross-built on amd64, the Debug commit/compile/fuzz suites run under QEMU; no sanitizers or coverage (AGENTS.md).
name: Linux riscv64 · cross build + test

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # compiler-cache-save deletes its key's older cache entries.
  actions: write

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-riscv64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build-ubuntu26_04_clang-riscv64:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-riscv64.yml@develop
    with:
      script: bash -lc 'bash scripts/linux/ci-riscv64-test.sh'
      container-args: -e CARGO_HOME=/tmp/cargo-home
      cache-lane: riscv64-clang
      cache-mounts: 'sccache:/var/cache/sccache cargo-home:/tmp/cargo-home'
      cache-env: 'SCCACHE_CACHE_SIZE=2G'
      timeout-minutes: 90
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
