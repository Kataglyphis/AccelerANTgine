name: Linux arm64 · build + test

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# Exactly what the nested reusable-linux.yml job asks for; a narrower grant makes it refuse to start.
permissions:
  contents: read
  packages: read
  # compiler-cache-save deletes its key's older cache entries.
  actions: write

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build-ubuntu26_04_gcc-arm:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: gcc
      runner: ubuntu-26.04-arm
      arch: arm64
      platform: linux/arm64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-ubuntu26_04_clang-arm:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: clang
      runner: ubuntu-26.04-arm
      arch: arm64
      platform: linux/arm64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host-arm64:
    name: Packages on a clean Ubuntu 26.04 (arm64)
    needs: build-ubuntu26_04_clang-arm
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: linux-packages-arm64
          deb: '*.deb'
          deb-command: AccelerANTgine --gst_check
          tarball: '*.tar.gz'
          tarball-command: ./usr/bin/AccelerANTgine --gst_check
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --gst_check'
