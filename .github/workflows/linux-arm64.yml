name: Linux arm64 · build + test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# The ceiling for the nested reusable-linux.yml job, which asks for exactly
# this; a narrower grant here makes it refuse to start.
permissions:
  contents: read
  packages: read

jobs:
  build-ubuntu26_04_gcc-arm:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: gcc
      runner: ubuntu-26.04-arm
      arch: arm64
      platform: linux/arm64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-ubuntu26_04_clang-arm:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: clang
      runner: ubuntu-26.04-arm
      arch: arm64
      platform: linux/arm64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
