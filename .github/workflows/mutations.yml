name: Linux x64 · mutation gates

# Proves the skip gate, coverage floors, chain-only ORT proof and static-analysis gates can fail; it builds nothing.
on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutations:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/mutation-gates.yml@develop
    with:
      manifest: scripts/linux/tests/lane-mutations.json
      submodules: 'true'
