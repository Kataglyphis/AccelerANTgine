name: Linux · reusable build

# Called once per (arch x compiler) by linux-x64.yml and linux-arm64.yml.

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      GHCR_PAT:
        required: true

# No image env: each container action's default `image:` is the family ref, gated against versions.env.

# Read only for any job that names no grant of its own.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # Bounds a hung step well short of the 6-hour default; green runs take under an hour.
    timeout-minutes: 120
    # Written down so a settings change cannot widen it; every caller must grant at least this.
    permissions:
      contents: read
      packages: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    defaults:
      run:
        shell: bash
    # As -e flags, since an action's run block inherits the job's env: a Cargo home that outlasts each part, the run ID for benchmark records.
    env:
      LANE_CONTAINER_ARGS: >-
        --privileged --platform ${{ inputs.platform }}
        -e CARGO_HOME=/workspace/.cache/cargo
        -e GITHUB_RUN_ID=${{ github.run_id }}

    steps:

      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      # sccache for clang, ccache for GCC; only pushes to develop save, so other runs spend no quota.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ inputs.arch }}-${{ inputs.compiler }}

      # One step per part (hub CON293's pattern): a red part names itself, and every part after a green build still runs.
      - name: "Lane part: build and test"
        id: build
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part build-test --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: coverage"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part coverage --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: static analysis and format"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part static --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: profile builds and benchmarks"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part bench --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: Python wheels (Clang only)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.compiler == 'clang' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part python --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: the leg's skipped tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part skips --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: release packages"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part release --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      - name: "Lane part: docs"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: ${{ env.LANE_CONTAINER_ARGS }} ${{ steps.cc.outputs.docker-args }}
          script: bash -lc 'bash scripts/linux/ci-run-all.sh --part docs --compiler "${{ inputs.compiler }}" --runner "${{ inputs.runner }}" --arch "${{ inputs.arch }}"'

      # quality-report.toml reads every JUnit report, the coverage summary and the clang-tidy findings from here.
      - name: Upload the test, coverage and clang-tidy reports
        if: ${{ success() || (failure() && hashFiles('docs/test_results*.xml') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ inputs.arch }}-${{ inputs.compiler }}
          if-no-files-found: error
          path: |
            docs/test_results*.xml
            logs/python-*.xml
            logs/coverage/coverage.json
            logs/coverage/coverage-summary.json
            logs/code-quality/clang-tidy.txt

      # perfTestSuite's results.json and the cachegrind counts, which a later baseline is recorded from.
      - name: Upload the benchmark results
        if: ${{ success() || (failure() && hashFiles('logs/perf/results.json') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results-${{ inputs.arch }}-${{ inputs.compiler }}
          if-no-files-found: error
          path: |
            logs/perf/results.json
            logs/perf/cachegrind.json

      # Ungated: hosted CPUs differ up to twofold in wall time, so the instruction-count check gates instead.
      - name: Benchmark history
        uses: Kataglyphis/ANTfrastructure/.github/actions/bench-history@develop
        with:
          key: perf-${{ inputs.arch }}-${{ inputs.compiler }}
          format: google-benchmark
          result: logs/perf/results.json
          metrics: >-
            {"BM_PreprocessFrame": {"direction": "lower"},
            "BM_DetectFrame": {"direction": "lower"},
            "BM_SessionCreate": {"direction": "lower"},
            "BM_TextGenerateTiny": {"direction": "lower"},
            "*/tokens_per_second": {"direction": "higher"},
            "BM_VideoPipelineKeepsUp*/frames_per_second": {"direction": "higher"},
            "BM_VideoPipelineKeepsUp*/dropped_share": {"direction": "lower"},
            "*/bytes_per_second": {"direction": "higher"}}

      # ci-profile-bench.sh keeps a crash's status, core and backtrace here (the WebRTC workload's SIGSEGV, BACKLOG).
      - name: Upload the crash evidence (when a profiled workload died on a signal)
        if: ${{ failure() && hashFiles('build/crash-evidence/status.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-evidence-${{ inputs.arch }}-${{ inputs.compiler }}
          if-no-files-found: error
          path: build/crash-evidence

      - name: Save compiler cache
        if: always()
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ inputs.arch }}-${{ inputs.compiler }}

      - name: Upload Linux Packages (Clang only)
        if: ${{ inputs.compiler == 'clang' && (success() || (failure() && hashFiles('build-release/*.deb') != '')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ inputs.arch }}
          # ci-release.sh asserts the artifacts exist, so an empty upload means that check was bypassed.
          if-no-files-found: error
          path: |
            build-release/*.tar.gz
            build-release/*.tgz
            build-release/*.deb
            build-release/*.AppImage
            build-release/*.flatpak

      # After the upload, so a red check still leaves the packages; root mounts over the plugin directory.
      - name: Stream from a fresh registry on the finished packages (Clang only)
        if: ${{ inputs.compiler == 'clang' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --privileged --platform ${{ inputs.platform }} --user 0:0
          script: bash scripts/linux/check-package-fresh-registry.sh build-release

      # ci-python-bindings.sh dies unless both wheels were built, installed and tested.
      - name: Upload Python wheels, GIL and free-threaded, at the hub's Python (Clang only)
        if: ${{ inputs.compiler == 'clang' && (success() || (failure() && hashFiles('dist/python/*/*.whl') != '')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheels-${{ inputs.arch }}
          if-no-files-found: error
          path: |
            dist/python/gil/*.whl
            dist/python/free-threaded/*.whl

      # ci-docs.sh builds the site on this runner and compiler only; linux-x64.yml's docs job checks and publishes it.
      - name: Upload the docs site (Clang x64 only)
        if: ${{ inputs.runner == 'ubuntu-26.04' && inputs.compiler == 'clang' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accelerantgine-docs-site
          path: docs/build/html/
          # The site whole: upload-artifact leaves out dot files such as Sphinx's .buildinfo unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
