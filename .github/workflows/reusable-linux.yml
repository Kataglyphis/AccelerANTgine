name: Linux · reusable build

# Called once per (arch x compiler) by linux-x64.yml and linux-arm64.yml - the
# fleet naming convention (2026-09-24): one caller file per platform + arch.

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      GHCR_PAT:
        required: true

# No image env: each container action's `image:` input default IS the family ref,
# and ANTfrastructure's verify_ci_image_refs.py gates it against versions.env.

jobs:
  build:
    runs-on: ${{ inputs.runner }} # Dynamically use input
    # Measured: green runs took up to 48 min (x64 and arm64, 2026-03), recent
    # ones 18-33 min. 120 bounds a hung step well short of the 6-hour default.
    timeout-minutes: 120
    # Exactly the repository's restricted default (read, measured 2026-09-24),
    # written down so a settings change cannot widen it. Every caller must
    # grant at least this, or the nested job refuses to start.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash

    steps:

      # ANTfrastructure's shared prologue: reclaim runner disk, check out, log in to
      # ghcr and pull with retries. Replaces four hand-rolled steps including a
      # copy of the retry loop, so the retry count and per-attempt timeout live
      # in one place for every repo instead of drifting per workflow.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      # The compiler cache outlives the container: sccache for the clang presets,
      # ccache for GCC (the hub's Cache.cmake forces it). The image's cache dirs
      # are mounted from this runner dir. Keyed per run, restored from the newest;
      # only pushes (main/develop) save, so PR and dispatch runs cost no quota.
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/compiler-cache
          key: compiler-cache-${{ inputs.arch }}-${{ inputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-cache-${{ inputs.arch }}-${{ inputs.compiler }}-

      - name: Prepare compiler cache dirs
        run: |
          mkdir -p "${{ runner.temp }}/compiler-cache/sccache" "${{ runner.temp }}/compiler-cache/ccache"
          chmod -R a+rwX "${{ runner.temp }}/compiler-cache"
          du -sh "${{ runner.temp }}/compiler-cache"/*

      #################################################################################################################
      ######################################## Prepare deps ###########################################################
      #################################################################################################################
      # run-in-linux-container instead of a hand-rolled `docker run`. extra-args
      # is substituted verbatim into the action's docker command line, so the
      # -e values are quoted here rather than passed through a step-level env:
      # an action's own run block does not inherit the CALLER STEP's env, only
      # the job's.
      - name: Run build/test/docs/package inside container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          # CARGO_HOME muss auf einen SCHREIBBAREN Pfad zeigen. Der Image-Default
          # ist /usr/local/cargo und gehoert root, waehrend der Container als
          # Nicht-Root laeuft - cxxbridge-cmd scheiterte damit an
          #   error: failed to create directory
          #     `/usr/local/cargo/registry/cache/index.crates.io-...`
          #     Permission denied (os error 13)
          # Dieselbe Klasse wie UV_PYTHON=/opt/venv auf der Python-Seite: ein
          # root-eigenes Shared-Verzeichnis als Default, in das ein Nicht-Root-
          # Build schreiben will. /tmp ist im Container immer schreibbar; der
          # Registry-Cache ist ohnehin nicht laufuebergreifend persistent.
          extra-args: >-
            --privileged --platform ${{ inputs.platform }}
            -e CARGO_HOME=/tmp/cargo
            -v ${{ runner.temp }}/compiler-cache/sccache:/var/cache/sccache
            -v ${{ runner.temp }}/compiler-cache/ccache:/var/cache/ccache
            -e SCCACHE_CACHE_SIZE=2G -e CCACHE_MAXSIZE=2G
          script: >-
            bash -lc 'set -e; bash scripts/linux/ci-run-all.sh
            --compiler "${{ inputs.compiler }}"
            --runner "${{ inputs.runner }}"
            --arch "${{ inputs.arch }}"
            --build-type "Debug"
            --build-dir "build"
            --build-release-dir "build-release"
            --gcc-debug-preset "linux-debug-GNU"
            --clang-debug-preset "linux-debug-clang"
            --gcc-profile-preset "linux-profile-GNU"
            --clang-profile-preset "linux-profile-clang"
            --clang-release-preset "linux-release-clang"
            --coverage-json "coverage.json"
            --docs-out "build/build/html"
            --release-callgrind "0"
            --release-appimage "1"
            --release-flatpak "1"
            --release-appimage-out-dir ""
            --release-flatpak-out-dir ""'

      - name: Save compiler cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/compiler-cache
          key: compiler-cache-${{ inputs.arch }}-${{ inputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Linux Packages (Clang only)
        if: ${{ inputs.compiler == 'clang' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          # ci-release.sh already asserts the artifacts exist; an empty upload
          # here means that assertion was bypassed, so it fails the job.
          if-no-files-found: error
          path: |
            build-release/*.tar.gz
            build-release/*.tgz
            build-release/*.deb
            build-release/*.AppImage
            build-release/*.flatpak

      # The family's one FTP policy (upstream pin, permission fixup, empty-tree
      # refusal): third_party/ANTfrastructure/docs/ftp-deploys.md. A manual
      # dispatch (any branch) never deploys.
      - name: Sync files to domain
        if: inputs.runner == 'ubuntu-26.04' && inputs.compiler == 'clang' && github.event_name != 'workflow_dispatch'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: ./docs/build/html/
