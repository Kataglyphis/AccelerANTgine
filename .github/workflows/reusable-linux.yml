name: Linux · reusable build

# Called once per (arch x compiler) by linux-x64.yml and linux-arm64.yml.

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      GHCR_PAT:
        required: true

# No image env: each container action's default `image:` is the family ref, gated against versions.env.

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # Bounds a hung step well short of the 6-hour default; green runs take under an hour.
    timeout-minutes: 120
    # Written down so a settings change cannot widen it; every caller must grant at least this.
    permissions:
      contents: read
      packages: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write
    defaults:
      run:
        shell: bash

    steps:

      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      # sccache for clang, ccache for GCC; only pushes to develop save, so other runs spend no quota.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ inputs.arch }}-${{ inputs.compiler }}

      # Env goes in extra-args: an action's run block inherits the job's env, not the calling step's.
      - name: Run build/test/docs/package inside container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          # CARGO_HOME must be writable: the image default /usr/local/cargo is root-owned and the container runs as non-root.
          extra-args: >-
            --privileged --platform ${{ inputs.platform }}
            -e CARGO_HOME=/tmp/cargo
            ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash -lc 'set -e; bash scripts/linux/ci-run-all.sh
            --compiler "${{ inputs.compiler }}"
            --runner "${{ inputs.runner }}"
            --arch "${{ inputs.arch }}"
            --build-type "Debug"
            --build-dir "build"
            --build-release-dir "build-release"
            --gcc-debug-preset "linux-debug-GNU"
            --clang-debug-preset "linux-debug-clang"
            --gcc-profile-preset "linux-profile-GNU"
            --clang-profile-preset "linux-profile-clang"
            --clang-release-preset "linux-release-clang"
            --coverage-json "coverage.json"
            --docs-out "build/build/html"
            --release-callgrind "0"
            --release-appimage "1"
            --release-flatpak "1"
            --release-appimage-out-dir ""
            --release-flatpak-out-dir ""'

      - name: Save compiler cache
        if: always()
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ inputs.arch }}-${{ inputs.compiler }}

      - name: Upload Linux Packages (Clang only)
        if: ${{ inputs.compiler == 'clang' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          # ci-release.sh asserts the artifacts exist, so an empty upload means that check was bypassed.
          if-no-files-found: error
          path: |
            build-release/*.tar.gz
            build-release/*.tgz
            build-release/*.deb
            build-release/*.AppImage
            build-release/*.flatpak

      # See third_party/ANTfrastructure/docs/ftp-deploys.md; a manual dispatch never deploys.
      - name: Sync files to domain
        if: inputs.runner == 'ubuntu-26.04' && inputs.compiler == 'clang' && github.event_name != 'workflow_dispatch'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: ./docs/build/html/
