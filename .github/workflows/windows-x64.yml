# Builds the three clang-cl configurations in the family image; the runner host then runs each one.
name: Windows x64 · build + test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run is cancelled, except on the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build, test, package (x64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: amd64
      build-script: scripts/windows/Build-Windows.ps1
      build-args: |
        -WorkspaceDir
        C:\ws
        -BuildTargets
        clangcl-debug,clangcl-profile,clangcl-release
      # The container has no desktop, so the host runs what the build synced back.
      host-command: |
        ./scripts/windows/Start-Windows.ps1 -Config Debug -ProjectRoot .
        ./scripts/windows/Start-Windows.ps1 -Config Profile -ProjectRoot .
        ./scripts/windows/Start-Windows.ps1 -Config Release -ProjectRoot .
      artifact-name: AccelerANTgine-windows-x64
      artifact-dir: dist/windows-x64
      # A cold container build takes about three hours; 240 still ends a hung step early.
      timeout-minutes: 240
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # No -FailOnAnalyzer yet: parse and AST-trap errors fail, PSScriptAnalyzer stays advisory until triaged.
  lint-powershell:
    name: PowerShell lint (scripts)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # Top-level submodules only: the gate is the hub's Invoke-Lint.ps1.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Lint PowerShell (parse gate + PSScriptAnalyzer)
        run: >-
          pwsh -NoProfile -File third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1
          -Path scripts

  pester-tests:
    name: Pester suites (scripts/windows/tests)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Not recursive: a recursive checkout dies with "Filename too long" in ANTfrastructure's nested chain.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # Pinned: the suites use Pester 3.4's dash-less `Should Be`, which the runner's Pester 5 cannot parse.
      - name: Run Pester suites (pinned 3.4.0)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: scripts/windows/tests
          version: '3.4.0'
