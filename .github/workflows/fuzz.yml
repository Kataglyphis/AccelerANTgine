name: Linux x64 · coverage-guided fuzzing (by hand and before a release)

# FuzzTest's fuzzing mode on every target, resuming from the corpus the last run kept; by hand, or gating release.yml (owner).
on:
  workflow_dispatch:
    inputs:
      duration:
        description: How long each fuzz target runs (90s, 3m, 1h)
        required: false
        default: 3m
  workflow_call:
    inputs:
      duration:
        description: How long each fuzz target runs (90s, 3m, 1h)
        type: string
        required: false
        default: 3m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    # Eleven targets at the default 3 minutes, plus a cold build.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
      # cache/save writes the kept corpus.
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          submodules: recursive

      - name: Restore the kept corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: logs/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build the fuzz tree and fuzz every target
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        env:
          DURATION: ${{ inputs.duration }}
        with:
          extra-args: --privileged -e CARGO_HOME=/tmp/cargo -e DURATION
          script: bash -lc 'bash scripts/linux/ci-fuzz.sh "${DURATION:-3m}" logs/fuzz-corpus'

      - name: Keep the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: logs/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload the corpus and any finding
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          if-no-files-found: error
          path: logs/fuzz-corpus
