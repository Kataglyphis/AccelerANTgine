name: CMake on Windows MSVC/Clang x64

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_DIR_RELEASE: "build-clangcl-release"
  GHCR_IMAGE_WIN: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64

defaults:
  run:
    shell: pwsh # Set PowerShell as default shell for all steps

jobs:
  build:
    runs-on: windows-2025
    steps:

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      # The winamd64 image is ~54 GB to import and Docker keeps its data-root on
      # the SYSTEM drive. Measured on a windows-2025 runner 2026-08-11:
      #   C: 29.9 GB free of 149.4 | D: 219.5 GB free of 220.0
      # Pointing the data-root at D: puts the image where the space is, instead of
      # deleting Visual Studio off C: to make room. MUST precede the pull.
      - name: 'Put the Docker data-root on D:'
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/set-docker-data-root@main
        with:
          data-root: 'D:\docker'
      # my windows container is quite big ... so remove runner packages for enough
      # dis space
      - name: Cleanup disk space
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/cleanup-disk-space@main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Pull container image
        run: |
          docker pull "${{ env.GHCR_IMAGE_WIN }}"

      - name: Build in container via wrapper
        run: |
          .\scripts\windows\start-build.ps1 -ProjectRoot "${{ github.workspace }}" -Image "${{ env.GHCR_IMAGE_WIN }}" -CpuCount "32" -Memory "48g"

      - name: Run debug build on host
        run: |
          .\scripts\windows\start-debug.ps1 -ProjectRoot "${{ github.workspace }}"

      - name: Run profile build on host
        run: |
          .\scripts\windows\start-profile.ps1 -ProjectRoot "${{ github.workspace }}"

      - name: Run release build on host
        run: |
          .\scripts\windows\start-release.ps1 -ProjectRoot "${{ github.workspace }}"

      - name: Upload Installers & Zip (container build)
        uses: actions/upload-artifact@v6.0.0
        with:
          name: windows-installers-container
          path: |
            ${{ github.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.msi
            ${{ github.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.exe
            ${{ github.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.zip
