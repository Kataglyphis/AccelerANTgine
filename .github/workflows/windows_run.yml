name: CMake on Windows MSVC/Clang x64

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_DIR_RELEASE: "build-clangcl-release"

defaults:
  run:
    shell: pwsh # Set PowerShell as default shell for all steps

jobs:
  build:
    runs-on: windows-2025
    steps:

      # The whole prologue - long paths, checkout, short-path clone, data-root
      # move, disk cleanup, registry login, pull, disk report - is ANTfrastructure's.
      #
      # The short-path clone is not optional here: `submodules: recursive` on the
      # normal workspace was failing this lane at the CHECKOUT step with
      # "Filename too long" on the ANTfrastructure -> DocumANTation -> md2pdfLib ->
      # latex/awesome-beamer chain, so nothing after it ever ran.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT || github.token }}
          fetch-depth: 0
          short-path-target: /d/ws

      # Every path below is steps.prep.outputs.workspace, NOT github.workspace:
      # the build tree lives in the short-path clone, and the wrapper scripts
      # live with it. A relative `.\scripts\...` would resolve against the
      # submodule-less checkout instead.
      - name: Build in container via wrapper
        run: |
          # CpuCount/MemoryGb only bite under -Isolation hyperv; process
          # isolation (the default) shares the whole host.
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\Start-Build.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}" -CpuCount 32 -MemoryGb 48

      - name: Run debug build on host
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\Start-Debug.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}"

      - name: Run profile build on host
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\Start-Profile.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}"

      - name: Run release build on host
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\Start-Release.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}"

      - name: Upload Installers & Zip (container build)
        uses: actions/upload-artifact@v6.0.0
        with:
          name: windows-installers-container
          path: |
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.msi
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.exe
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.zip

  # CPU-only and container-free: this repo's own Pester suites under
  # scripts/windows/tests. It builds nothing, finishes in minutes and therefore
  # carries no opt-in condition - an invariant that only runs when somebody
  # remembers to ask for it is not a gate.
  pester-tests:
    name: Pester suites (scripts/windows/tests)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # `submodules: true` is top-level only, NOT recursive, and that matters
      # here: recursive checkout is exactly what forces the build job above into
      # a short-path clone, dying with "Filename too long" on the
      # ANTfrastructure -> DocumANTation -> md2pdfLib -> latex/awesome-beamer
      # chain. These suites read only ANTfrastructure's own
      # windows/scripts/modules, which arrives at depth 1.
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      # Pinned, not the runner's default: the suites are written in Pester 3.4's
      # dash-less assertion syntax (`Should Be 0`), which the Pester 5 shipped on
      # the runner cannot parse. The install/run/report mechanics are generic and
      # live in ANTfrastructure; run-pester-suite also refuses a vacuous pass
      # (TotalCount == 0 -> exit 1), so this cannot go green over an empty
      # directory.
      - name: Run Pester suites (pinned 3.4.0)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@main
        with:
          path: scripts/windows/tests
          version: '3.4.0'
