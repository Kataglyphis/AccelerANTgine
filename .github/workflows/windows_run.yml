name: CMake on Windows MSVC/Clang x64

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_DIR_RELEASE: "build-clangcl-release"
  GHCR_IMAGE_WIN: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64

defaults:
  run:
    shell: pwsh # Set PowerShell as default shell for all steps

jobs:
  build:
    runs-on: windows-2025
    steps:

      # The whole prologue - long paths, checkout, short-path clone, data-root
      # move, disk cleanup, registry login, pull, disk report - is ContainerHub's.
      #
      # The short-path clone is not optional here: `submodules: recursive` on the
      # normal workspace was failing this lane at the CHECKOUT step with
      # "Filename too long" on the ContainerHub -> DocumANTation -> md2pdfLib ->
      # latex/awesome-beamer chain, so nothing after it ever ran.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/prepare-windows-container-host@main
        with:
          image: ${{ env.GHCR_IMAGE_WIN }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT || github.token }}
          fetch-depth: 0
          short-path-target: /d/ws

      # Every path below is steps.prep.outputs.workspace, NOT github.workspace:
      # the build tree lives in the short-path clone, and the wrapper scripts
      # live with it. A relative `.\scripts\...` would resolve against the
      # submodule-less checkout instead.
      - name: Build in container via wrapper
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\start-build.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}" -Image "${{ env.GHCR_IMAGE_WIN }}" -CpuCount "32" -Memory "48g"

      - name: Run debug build on host
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\start-debug.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}"

      - name: Run profile build on host
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\start-profile.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}"

      - name: Run release build on host
        run: |
          & "${{ steps.prep.outputs.workspace }}\scripts\windows\start-release.ps1" -ProjectRoot "${{ steps.prep.outputs.workspace }}"

      - name: Upload Installers & Zip (container build)
        uses: actions/upload-artifact@v6.0.0
        with:
          name: windows-installers-container
          path: |
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.msi
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.exe
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.zip
