name: Linux GPU package candidates

on:
  workflow_dispatch:
    inputs:
      gpu-tuple:
        description: Build all supported GPUs or select one vendor and architecture
        type: choice
        options: [all, nvidia-x64, nvidia-arm64, amd-x64]
        default: all
      invocation-scope:
        description: Unique lowercase scope for overlapping calls in the same run
        type: string
        default: default
      verify-gpu:
        description: Profile the finished candidate on vendor-labelled GPU runners
        type: boolean
        default: false
      promote-verified:
        description: Stage packages after clean-host and CPU/GPU detector parity checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      gpu-tuple:
        type: string
        default: all
      invocation-scope:
        type: string
        default: default
      verify-gpu:
        type: boolean
        default: false
      promote-verified:
        type: boolean
        default: false
    secrets:
      GHCR_PAT:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      suffix: ${{ steps.scope.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the invocation scope
        id: scope
        env:
          GPU_INVOCATION_SCOPE: ${{ inputs.invocation-scope }}
        run: python3 -I scripts/linux/gpu-invocation-scope.py

  select-tuple:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select supported Linux GPU tuples
        id: matrix
        env:
          GPU_TUPLE: ${{ inputs.gpu-tuple }}
        run: python3 -I scripts/linux/select-gpu-matrix.py

  build:
    name: GPU candidate (${{ matrix.vendor }}, ${{ matrix.arch }})
    needs: [scope, select-tuple]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-tuple.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: accelerantgine-linux-build-${{ github.workflow }}-${{ github.ref }}-${{ needs.scope.outputs.suffix }}-${{ matrix.vendor }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 240
    steps:
      - name: Require hardware checks for promotion
        if: ${{ inputs.promote-verified && !inputs.verify-gpu }}
        run: |
          echo '::error::Promotion requires verify-gpu.'
          exit 1
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check pinned GPU packaging APIs
        shell: bash
        run: |
          set -euo pipefail
          model_verifier=third_party/ANTfrastructure/shared/python/verify_locked_files.py
          model_fetcher=third_party/ANTfrastructure/linux/scripts/lib/fetch-data-lock.py
          profile_env=third_party/ANTfrastructure/linux/scripts/lib/gpu-profile-env.sh
          profile_log=third_party/ANTfrastructure/linux/scripts/lib/log-bootstrap.sh
          if ! test -f "$profile_env" || ! test -f "$profile_log" || ! grep -q '^gpu_without_migraphx_overrides()' "$profile_env"; then
            echo 'Pinned ANTfrastructure lacks GPU profile environment isolation' >&2; exit 1
          fi
          if ! test -f "$model_verifier" || ! test -f "$model_fetcher" || ! grep -q '^def read_lock(' "$model_fetcher" || ! grep -q '^def matches(' "$model_fetcher"; then
            echo 'Pinned ANTfrastructure lacks locked-model verification APIs' >&2; exit 1
          fi
          test -f third_party/ANTfrastructure/shared/python/compare_detector_parity.py || { echo 'Pinned ANTfrastructure lacks detector parity comparison' >&2; exit 1; }
          test -f third_party/ANTfrastructure/shared/python/tests/test_compare_detector_parity.py || { echo 'Pinned ANTfrastructure lacks detector parity tests' >&2; exit 1; }
          python3 -I third_party/ANTfrastructure/shared/python/compare_detector_parity.py --help | grep -q -- --pairwise
          bash scripts/linux/tests/test-ci-gpu-candidate.sh
          bash scripts/linux/tests/test-profile-gpu-candidate.sh
          python3 scripts/linux/tests/test-profile-parity-mutations.py
          bash scripts/linux/tests/test-check-gpu-detector-parity.sh
          bash scripts/linux/tests/test-diagnose-migraphx-detector.sh
          python3 -I third_party/ANTfrastructure/shared/python/tests/test_compare_detector_parity.py
          bash scripts/linux/tests/test-check-clean-host-inference.sh
          python3 scripts/linux/tests/test-gpu-workflow-artifacts.py
          python3 scripts/linux/tests/test-gpu-promotion-metadata.py
          bash scripts/linux/tests/test-ci-release-ort-variant.sh
          bash scripts/linux/tests/test-verify-gpu-packages.sh
          cmake -DHUB_DIR="$GITHUB_WORKSPACE/third_party/ANTfrastructure" -P cmake/VerifyGpuPackagingHub.cmake
          test -f third_party/ANTfrastructure/shared/python/verify_ort_profile.py
          python3 -I third_party/ANTfrastructure/shared/python/verify_ort_profile.py --help | grep -q -- --min-runs
          python3 -I third_party/ANTfrastructure/shared/python/tests/test_verify_ort_profile.py
      - name: Select registry image
        id: image
        shell: bash
        run: |
          cpu_image="$(bash third_party/ANTfrastructure/linux/scripts/ci-image-ref.sh --linux)"
          printf 'ref=%s:%s\n' "${cpu_image%:*}" '${{ matrix.tag }}' >> "$GITHUB_OUTPUT"
      - name: Prepare disk and pull the GPU image
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          image: ${{ steps.image.outputs.ref }}
          checkout: 'false'
          free-disk-space: 'true'
          pull-first: 'false'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
      - name: Build and check package candidates
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          image: ${{ steps.image.outputs.ref }}
          extra-args: >-
            --platform ${{ matrix.platform }}
            -e GPU_VARIANT=${{ matrix.vendor }}
            -e CARGO_HOME=/tmp/cargo
            -e SCCACHE_DISABLE=1
          script: bash scripts/linux/ci-gpu-candidate.sh
      - name: Upload unverified candidates
        if: ${{ !inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accelerantgine-unverified-gpu-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          overwrite: false
          if-no-files-found: error
          path: |
            build-gpu/*.tar.gz
            build-gpu/*.deb
            build-gpu/*.AppImage
      - name: Select the exact promotion packages
        if: ${{ inputs.promote-verified }}
        id: files
        env:
          GPU_VENDOR: ${{ matrix.vendor }}
          GPU_ARCH: ${{ matrix.arch }}
        run: python3 -I scripts/linux/gpu-promotion-metadata.py select build-gpu
      - name: Upload exact unverified promotion input
        if: ${{ inputs.promote-verified }}
        id: promotion_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-accelerantgine-gpu-input-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          overwrite: false
          if-no-files-found: error
          path: |
            build-gpu/*.tar.gz
            build-gpu/*.deb
            build-gpu/*.AppImage
      - name: Record this tuple's immutable upload identity
        if: ${{ inputs.promote-verified }}
        env:
          GPU_VENDOR: ${{ matrix.vendor }}
          GPU_ARCH: ${{ matrix.arch }}
          GPU_ARTIFACT_ID: ${{ steps.promotion_upload.outputs.artifact-id }}
          GPU_ARTIFACT_DIGEST: ${{ steps.promotion_upload.outputs.artifact-digest }}
          GPU_ARTIFACT_FILES: ${{ steps.files.outputs.files }}
        run: python3 -I scripts/linux/gpu-promotion-metadata.py create "$RUNNER_TEMP/gpu-metadata.json"
      - name: Upload this tuple's promotion metadata
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-accelerantgine-gpu-meta-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-metadata.json
          overwrite: false
          if-no-files-found: error

  clean-host:
    name: Clean-host package startup (${{ matrix.vendor }}, ${{ matrix.arch }})
    needs: [scope, select-tuple, build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.select-tuple.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-tuple.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: accelerantgine-linux-clean-${{ github.workflow }}-${{ github.ref }}-${{ needs.scope.outputs.suffix }}-${{ matrix.vendor }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 30
    steps:
      - name: Check out the locked model fetcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Fetch the locked model
        shell: bash
        run: python3 -I third_party/ANTfrastructure/linux/scripts/lib/fetch-data-lock.py --lock models/models.lock
      - name: Download tuple-specific promotion metadata
        if: ${{ inputs.promote-verified }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-accelerantgine-gpu-meta-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-metadata
          digest-mismatch: error
      - name: Validate this tuple's current-attempt identity
        if: ${{ inputs.promote-verified }}
        id: metadata
        env:
          GPU_VENDOR: ${{ matrix.vendor }}
          GPU_ARCH: ${{ matrix.arch }}
        run: python3 -I scripts/linux/gpu-promotion-metadata.py resolve "$RUNNER_TEMP/gpu-metadata/gpu-metadata.json"
      - name: Install and start the packages
        if: ${{ !inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: accelerantgine-unverified-gpu-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: AccelerANTgine --gst_check && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --demo /usr/bin/AccelerANTgine_demo && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --demo /usr/bin/AccelerANTgine_demo "$GITHUB_WORKSPACE/models/deim_dfine_n_coco.onnx"
          tarball: '*.tar.gz'
          tarball-command: ./usr/bin/AccelerANTgine --gst_check && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --demo ./usr/bin/AccelerANTgine_demo
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --gst_check && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --appimage "$APPIMAGE"'
      - name: Check immutable packages on the clean host
        if: ${{ inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          artifact: unverified-accelerantgine-gpu-input-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          scan-elves: 'false'
          deb: '*.deb'
          deb-command: env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u KATAGLYPHIS_ONNX_MODEL -u KATAGLYPHIS_ONNX_BACKEND bash -c 'AccelerANTgine --gst_check && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --demo /usr/bin/AccelerANTgine_demo && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --demo /usr/bin/AccelerANTgine_demo "$GITHUB_WORKSPACE/models/deim_dfine_n_coco.onnx"'
          tarball: '*.tar.gz'
          tarball-command: env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u KATAGLYPHIS_ONNX_MODEL -u KATAGLYPHIS_ONNX_BACKEND bash -c './usr/bin/AccelerANTgine --gst_check && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --demo ./usr/bin/AccelerANTgine_demo'
          appimage: '*.AppImage'
          appimage-command: env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u KATAGLYPHIS_ONNX_MODEL -u KATAGLYPHIS_ONNX_BACKEND bash -c '"$APPIMAGE" --gst_check && bash "$GITHUB_WORKSPACE/scripts/linux/check-clean-host-inference.sh" --appimage "$APPIMAGE"'
          artifact-id: ${{ steps.metadata.outputs.artifact_id }}
          artifact-digest: ${{ steps.metadata.outputs.artifact_digest }}
          artifact-files: ${{ steps.metadata.outputs.files }}
          gpu-vendor: ${{ matrix.vendor }}
          gpu-arch: ${{ matrix.arch }}
          gpu-receipt: ${{ runner.temp }}/gpu-clean-receipt.json
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
      - name: Upload the clean-host receipt
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-accelerantgine-gpu-clean-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-clean-receipt.json
          overwrite: false
          if-no-files-found: error

  gpu-profile:
    if: ${{ inputs.verify-gpu }}
    needs: [scope, select-tuple, build, clean-host]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-tuple.outputs.matrix) }}
    runs-on: [self-hosted, Linux, '${{ matrix.runner-arch }}', '${{ matrix.gpu-runner }}']
    concurrency:
      group: accelerantgine-linux-profile-${{ github.workflow }}-${{ github.ref }}-${{ needs.scope.outputs.suffix }}-${{ matrix.vendor }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.promote-verified }}
        with:
          name: accelerantgine-unverified-gpu-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/accelerantgine-gpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.vendor }}-${{ matrix.arch }}${{ needs.scope.outputs.suffix }}
      - name: Require model operators on the requested GPU
        if: ${{ !inputs.promote-verified }}
        shell: bash
        env:
          DEVICE: ${{ matrix.device }}
          CANDIDATE_DIR: ${{ runner.temp }}/accelerantgine-gpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.vendor }}-${{ matrix.arch }}${{ needs.scope.outputs.suffix }}
        run: |
          set -euo pipefail
          python3 -I third_party/ANTfrastructure/linux/scripts/lib/fetch-data-lock.py --lock models/models.lock
          bash scripts/linux/profile-gpu-candidate.sh "$CANDIDATE_DIR" \
            "$GITHUB_WORKSPACE/models/deim_dfine_n_coco.onnx" "$DEVICE"
      - name: Download tuple-specific promotion metadata
        if: ${{ inputs.promote-verified }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-accelerantgine-gpu-meta-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-metadata
          digest-mismatch: error
      - name: Validate this tuple's current-attempt identity
        if: ${{ inputs.promote-verified }}
        id: metadata
        env:
          GPU_VENDOR: ${{ matrix.vendor }}
          GPU_ARCH: ${{ matrix.arch }}
        run: python3 -I scripts/linux/gpu-promotion-metadata.py resolve "$RUNNER_TEMP/gpu-metadata/gpu-metadata.json"
      - name: Fetch the locked model for profiling
        if: ${{ inputs.promote-verified }}
        run: python3 -I third_party/ANTfrastructure/linux/scripts/lib/fetch-data-lock.py --lock models/models.lock
      - name: Profile the immutable packages
        if: ${{ inputs.promote-verified }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/gpu-package-check@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          artifact-id: ${{ steps.metadata.outputs.artifact_id }}
          artifact-digest: ${{ steps.metadata.outputs.artifact_digest }}
          artifact-files: ${{ steps.metadata.outputs.files }}
          gpu-vendor: ${{ matrix.vendor }}
          gpu-arch: ${{ matrix.arch }}
          gpu-receipt: ${{ runner.temp }}/gpu-profile-receipt.json
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
          command: env -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u KATAGLYPHIS_ONNX_MODEL -u KATAGLYPHIS_ONNX_BACKEND -u KATAGLYPHIS_ORT_DEVICE bash scripts/linux/profile-gpu-candidate.sh "$GPU_PACKAGE_DIR" "$GITHUB_WORKSPACE/models/deim_dfine_n_coco.onnx" '${{ matrix.device }}'
      - name: Upload the GPU profile receipt
        if: ${{ inputs.promote-verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-accelerantgine-gpu-profile-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-profile-receipt.json
          overwrite: false
          if-no-files-found: error

  stage-verified:
    if: ${{ inputs.promote-verified && inputs.verify-gpu }}
    needs: [scope, select-tuple, build, clean-host, gpu-profile]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-tuple.outputs.matrix) }}
    runs-on: ubuntu-26.04
    concurrency:
      group: accelerantgine-linux-stage-${{ github.workflow }}-${{ github.ref }}-${{ needs.scope.outputs.suffix }}-${{ matrix.vendor }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download tuple-specific promotion metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-accelerantgine-gpu-meta-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-metadata
          digest-mismatch: error
      - name: Validate this tuple's current-attempt identity
        id: metadata
        env:
          GPU_VENDOR: ${{ matrix.vendor }}
          GPU_ARCH: ${{ matrix.arch }}
        run: python3 -I scripts/linux/gpu-promotion-metadata.py resolve "$RUNNER_TEMP/gpu-metadata/gpu-metadata.json"
      - name: Download the immutable candidate archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.metadata.outputs.artifact_id }}
          path: ${{ runner.temp }}/gpu-archive
          skip-decompress: true
          digest-mismatch: error
      - name: Select the candidate archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          archives=("$RUNNER_TEMP/gpu-archive"/*)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" && ! -L "${archives[0]}" && "${archives[0]}" != *$'\n'* && "${archives[0]}" != *$'\r'* ]] || { echo 'Expected one downloaded archive' >&2; exit 1; }
          printf 'path=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Download the clean-host receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-accelerantgine-gpu-clean-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-clean-receipt
          digest-mismatch: error
      - name: Download the GPU receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unverified-accelerantgine-gpu-profile-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-profile-receipt
          digest-mismatch: error
      - name: Stage the exact checked packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/stage-gpu-artifact@da0bdf709f491b900a9ed02c821d7cbc3a13c8be
        with:
          archive: ${{ steps.archive.outputs.path }}
          clean-receipt: ${{ runner.temp }}/gpu-clean-receipt/gpu-clean-receipt.json
          gpu-receipt: ${{ runner.temp }}/gpu-profile-receipt/gpu-profile-receipt.json
          output: ${{ runner.temp }}/gpu-verified-packages
          artifact-id: ${{ steps.metadata.outputs.artifact_id }}
          artifact-digest: ${{ steps.metadata.outputs.artifact_digest }}
          artifact-files: ${{ steps.metadata.outputs.files }}
          gpu-platform: linux
          gpu-vendor: ${{ matrix.vendor }}
          gpu-arch: ${{ matrix.arch }}
          max-uncompressed-bytes: '42949672960'
          max-compression-ratio: '1000'
      - name: Upload the checked packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-accelerantgine-linux-${{ matrix.vendor }}-${{ matrix.arch }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ needs.scope.outputs.suffix }}
          path: ${{ runner.temp }}/gpu-verified-packages/*
          overwrite: false
          if-no-files-found: error
