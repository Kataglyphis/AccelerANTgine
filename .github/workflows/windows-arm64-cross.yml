# .github/workflows/windows-arm64-cross.yml
#
# The Windows arm64 lane (owner decision 2026-09-25): Build-Windows.ps1
# -TargetArch arm64 cross-builds the clangcl-release configuration in the
# family image's arm64 bundle on an amd64 runner, and GitHub's windows-11-arm
# then RUNS the product. A thin caller of ANTfrastructure's
# container-ci-windows.yml, which owns the image, the arch gate, the upload and
# the run job; what is left here is what only this repo knows. Why Release
# only: third_party/ANTfrastructure/docs/windows-cross-builds.md.
#
# ALWAYS RUNS, like every lane here: no job-level `if:`.
name: Windows arm64 · cross build + run

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on a feature branch or PR is cancelled; runs on the default
# branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  cross:
    name: Cross build (arm64)
    uses: Kataglyphis/ANTfrastructure/.github/workflows/container-ci-windows.yml@develop
    with:
      target-arch: arm64
      build-script: scripts/windows/Build-Windows.ps1
      # Format is the x64 lane's: it reads the source, not the target.
      build-args: |
        -WorkspaceDir
        C:\ws
        -TargetArch
        arm64
        -BuildTargets
        clangcl-release
        -SkipFormat
      artifact-name: AccelerANTgine-windows-arm64
      artifact-dir: dist/windows-arm64
      # The exe, its DLL, the chain ONNX Runtime and the VC++ runtime at the least.
      arch-gate-min-inspected: 4
      # With no flag the CLI prints its version and exits 0, after the loader has
      # resolved every import: its DLL, GStreamer/GLib and ONNX Runtime.
      run-command: |
        ./bundle/bin/AccelerANTgine.exe
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
