name: Lint gates

# Standalone, not in reusable-linux.yml, so the tree is graded once; dev-box twin: scripts/linux/run-lint-gates.sh.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Read-only: this lane reports a verdict and writes nothing.
permissions:
  contents: read

jobs:
  lint-gates:
    name: shellcheck + actionlint + gitleaks + ruff + ratchets
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      ratchets: true

  ci-value-options:
    name: shared CI argument parser
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out direct submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Test all CI argument contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/test-results
          bash scripts/linux/tests/test-ci-value-options.sh > logs/test-results/ci-value-options.txt 2>&1 || {
            cat logs/test-results/ci-value-options.txt
            exit 1
          }
          cat logs/test-results/ci-value-options.txt
      - name: Test locked documentation installation
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux/tests/test-ci-docs-uv.sh > logs/test-results/ci-docs-uv.txt 2>&1 || {
            cat logs/test-results/ci-docs-uv.txt
            exit 1
          }
          cat logs/test-results/ci-docs-uv.txt
      - name: Test locked Python wheel lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux/tests/test-ci-python-lock.sh > logs/test-results/ci-python-lock.txt 2>&1 || {
            cat logs/test-results/ci-python-lock.txt
            exit 1
          }
          cat logs/test-results/ci-python-lock.txt
      - name: Test the third-party notice stager
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux/tests/test-third-party-notices.sh > logs/test-results/third-party-notices.txt 2>&1 || {
            cat logs/test-results/third-party-notices.txt
            exit 1
          }
          cat logs/test-results/third-party-notices.txt
      - name: Test the ONNX Runtime package matrix
        shell: bash
        run: bash scripts/linux/tests/test-ort-package-variant.sh
      - name: Test packaged GStreamer isolation
        shell: bash
        run: |
          bash scripts/linux/tests/test-isolate-package-gstreamer.sh
          bash scripts/linux/tests/test-package-gstreamer-cmake.sh
          bash scripts/linux/tests/test-check-clean-host-inference.sh
      - name: Save parser test log
        if: always() && hashFiles('logs/test-results/ci-value-options.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-value-options-${{ github.run_id }}
          path: logs/test-results/*.txt
          if-no-files-found: error
