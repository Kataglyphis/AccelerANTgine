name: Lint gates - shell, workflows, secrets, python

# ONE `uses:` LINE, because ANTfrastructure now ships the lane itself.
# Seven consumers carried this job as a copy, every copy's header saying
# "replace this with a `uses:` when the hub grows a reusable lint lane"; hub
# commit 987f832a is that lane (.github/workflows/lint-gates.yml, workflow_call).
# What the copy here did - checkout at fetch-depth 1 with submodules, install uv,
# run the aggregator against an EXPLICIT consumer root - is exactly what the hub
# job does, and the hub additionally pins actions/checkout by SHA rather than by
# tag. The dev-box command is unchanged and still the same one:
#
#   bash scripts/linux/run-lint-gates.sh [--ratchets]
#
# The hub job runs the aggregator DIRECTLY out of third_party/ANTfrastructure
# with "${GITHUB_WORKSPACE}" as the root rather than through that wrapper,
# because the wrappers sit at different paths across the family and one consumer
# has no submodule at all. Same script, same root, same verdict.
#
# submodules: 'true', NOT the hub's 'recursive' default. ANTfrastructure is the
# submodule these gates EXECUTE - all four lint scripts and the aggregator live
# inside it - and the other six top-level submodules come along at depth 1 with
# nothing below grading them, since every scope drops third_party/. Recursing
# into their trees would cost minutes and change no verdict.
#
# ratchets: true since 2026-09-15. The eight --root measurement gates plus
# doc-links now grade this tree; comment-size.allow and shellcheck-warnings.allow
# at the repo root are the seeded freeze files, and a new offender is red.
#
# NO CONTAINER IMAGE IS NAMED, unlike every other Linux lane here, and that is
# correct rather than an oversight: the gate binaries are bootstrapped from
# ANTfrastructure's own versions.env at pinned, SHA256-verified versions, so the
# verdict does not depend on what kataglyphis_beschleuniger happens to ship - and
# skipping the GHCR login and the multi-gigabyte pull is what makes this the
# first lane to finish.
#
# A STANDALONE WORKFLOW, not a job inside linux_run.yml: that file is a reusable
# workflow called once per (arch x compiler) by linux_run_x86.yml and
# linux_run_arm.yml, so a gate placed there would grade the same tree four times.
# The tree is architecture-independent and so is its verdict.
#
# @main, like every other ANTfrastructure reference in this repo: upstream is
# pushed before the consumer change that needs it.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Read-only: this lane reports a verdict and writes nothing. The other
# workflows here predate the default-permissions tightening and still run on
# the repository default.
permissions:
  contents: read

jobs:
  lint-gates:
    name: shellcheck + actionlint + gitleaks + ruff + ratchets
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@main
    with:
      submodules: 'true'
      ratchets: true
