name: Linux x64 · build + test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Exactly what the nested reusable-linux.yml job asks for; a narrower grant makes it refuse to start.
permissions:
  contents: read
  packages: read
  # compiler-cache-save deletes its key's older cache entries.
  actions: write

jobs:
  build-ubuntu26_04_gcc-x64:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: gcc
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-ubuntu26_04_clang-x64:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: clang
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
