name: Linux x64 · build + test

# The one build lane every push runs (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Exactly what the nested reusable-linux.yml job asks for; a narrower grant makes it refuse to start.
permissions:
  contents: read
  packages: read
  # compiler-cache-save deletes its key's older cache entries.
  actions: write

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build-ubuntu26_04_gcc-x64:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: gcc
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-ubuntu26_04_clang-x64:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: clang
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
