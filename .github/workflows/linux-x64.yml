name: Linux x64 · build + test

# The one build lane every push to develop runs; release.yml calls it on main (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  workflow_call:

# Exactly what the nested reusable-linux.yml job asks for; a narrower grant makes it refuse to start.
permissions:
  contents: read
  packages: read
  # compiler-cache-save deletes its key's older cache entries.
  actions: write

# Per lane and caller: the literal name keeps lanes apart, github.workflow (the caller's when called) keeps callers apart.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build-ubuntu26_04_gcc-x64:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: gcc
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-ubuntu26_04_clang-x64:
    uses: ./.github/workflows/reusable-linux.yml
    with:
      compiler: clang
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # The clang build's site, coverage included: the hub adds its .htaccess, checks every link and publishes on a push to develop or main.
  docs:
    needs: build-ubuntu26_04_clang-x64
    permissions:
      contents: read
    uses: Kataglyphis/ANTfrastructure/.github/workflows/build-docs.yml@develop
    with:
      artifact: accelerantgine-docs-site
    secrets:
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      FTP_PASSWORD: ${{ secrets.PW }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host-x64:
    name: Packages on a clean Ubuntu 26.04 (x64)
    needs: build-ubuntu26_04_clang-x64
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: linux-packages-x64
          deb: '*.deb'
          deb-command: AccelerANTgine --gst_check
          tarball: '*.tar.gz'
          tarball-command: ./usr/bin/AccelerANTgine --gst_check
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --gst_check'
