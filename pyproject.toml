[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "kataglyphis-inference"
version = "0.0.3"
description = "Python bindings for the Kataglyphis C++23 ONNX inference engine"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jonas Heinle" }]
dependencies = ["numpy>=1.26"]
classifiers = ["Programming Language :: Python :: Free Threading :: 2 - Beta"]

[project.optional-dependencies]
test = ["pytest"]

[dependency-groups]
docs = [
    "sphinx==9.2.0",
    "sphinx-book-theme==1.4.0",
    "sphinx-design==0.7.0",
    "myst-parser==5.1.0",
    "pyyaml==6.0.3",
    "cmake-format==0.6.13",
    "breathe==5.1.0",
    "exhale==0.3.7",
    "pre-commit==4.7.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-kataglyphis-theme",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.14" }

[tool.uv.sources]
sphinx-kataglyphis-theme = { path = "third_party/ANTfrastructure/third_party/DocumANTation/sphinx-kataglyphis-theme", editable = true }

[project.urls]
Homepage = "https://jonasheinle.de/"

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.31.6"
# The stub target too: the install rules ship _core.pyi and py.typed, which only it writes.
build.targets = ["kataglyphis_python", "kataglyphis_python_stub"]
install.components = ["python_bindings"]
wheel.packages = []
# Only the real license: the default globs also matched the placeholder LICENSE.rtf.
wheel.license-files = ["LICENSE"]

[tool.scikit-build.cmake.define]
KATAGLYPHIS_BUILD_PYTHON_BINDINGS = "ON"
BUILD_TESTING = "OFF"
myproject_ENABLE_CPPCHECK = "OFF"

[tool.pytest.ini_options]
testpaths = ["Test/python"]
