# Lane outputs and repo metrics for the hub's quality-report.sh, which holds no repo specifics.
schema_version = 1

[docs]
build_list = "docs/source/index.rst"
source = "docs/source"

# The bench-history records every develop push uploads; Windows and arm64 lanes run on request only.
[[output]]
kind = "benchmark"
path = "bench-history-perf-x64-gcc.json"
artifact = "bench-history-perf-x64-gcc"

[[output]]
kind = "benchmark"
path = "bench-history-perf-x64-clang.json"
artifact = "bench-history-perf-x64-clang"

# The Linux x64 build lane uploads these as test-reports-x64-<compiler>; a local run reads the checkout first.
[[artifact]]
name = "ctest"
kind = "junit"
path = "docs/test_results.xml"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "ctest-gcc"
kind = "junit"
path = "docs/test_results.xml"
artifact = "test-reports-x64-gcc"
workflow = "linux-x64.yml"

[[artifact]]
name = "ctest-tsan"
kind = "junit"
path = "docs/test_results_tsan.xml"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "python-gil"
kind = "junit"
path = "logs/python-gil.xml"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "python-free-threaded"
kind = "junit"
path = "logs/python-free-threaded.xml"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "python-contract-gil"
kind = "junit"
path = "logs/python-contract-gil.xml"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "python-contract-free-threaded"
kind = "junit"
path = "logs/python-contract-free-threaded.xml"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "clang"
kind = "coverage"
format = "json"
path = "logs/coverage/coverage.json"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

[[artifact]]
name = "gcc"
kind = "coverage"
format = "json"
path = "logs/coverage/coverage-summary.json"
artifact = "test-reports-x64-gcc"
workflow = "linux-x64.yml"

[[artifact]]
name = "clang"
kind = "clang-tidy"
path = "logs/code-quality/clang-tidy.txt"
artifact = "test-reports-x64-clang"
workflow = "linux-x64.yml"

# quality-report.sh --perf-host, inside :latest; DNNL answers not_collected while the image lacks libdnnl.so.3.
[perf]
setup = "bash scripts/linux/perf-host.sh setup"

[[perf.command]]
name = "detector_cpu"
run = "build-perf/bin/AccelerANTgine_demo --model models/deim_dfine_n_coco.onnx --detector-image third_party/ModelANT/contracts/fixtures/two_cats.jpg --detector-latency-runs 30 --device cpu"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "detector_xnnpack"
run = "build-perf/bin/AccelerANTgine_demo --model models/deim_dfine_n_coco.onnx --detector-image third_party/ModelANT/contracts/fixtures/two_cats.jpg --detector-latency-runs 30 --device xnnpack"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "detector_dnnl"
run = "build-perf/bin/AccelerANTgine_demo --model models/deim_dfine_n_coco.onnx --detector-image third_party/ModelANT/contracts/fixtures/two_cats.jpg --detector-latency-runs 30 --device dnnl"
metrics = [{ key = "p50_ms", unit = "ms", better = "lower" }, { key = "p95_ms", unit = "ms", better = "lower" }]

[[perf.command]]
name = "text_cpp"
run = "bash scripts/linux/perf-host.sh text-cpp"
metrics = [{ key = "ttft_ms", unit = "ms", better = "lower" }, { key = "decode_tok_s", unit = "tok/s", better = "higher" }]

[[perf.command]]
name = "text_python"
run = ".venv-perf-host/bin/python scripts/linux/perf_host_text.py --model resources/models/smollm2-perf"
metrics = [{ key = "ttft_ms", unit = "ms", better = "lower" }, { key = "decode_tok_s", unit = "tok/s", better = "higher" }]
